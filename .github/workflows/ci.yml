name: scoperoom-pr-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-unit-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.20.0
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm lint
      - run: corepack pnpm typecheck
      - run: corepack pnpm test:unit
      - run: corepack pnpm build

  database-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.20.0
      - run: corepack pnpm install --frozen-lockfile
      - run: bash scripts/ci/start-local-supabase.sh
      - run: bash scripts/ci/export-local-db-env.sh
      - run: corepack pnpm db:bootstrap
      - run: corepack pnpm test:integration
      - name: Stop isolated Supabase
        if: always()
        run: bash scripts/ci/stop-local-supabase.sh

  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.20.0
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm exec playwright install --with-deps chromium
      - run: corepack pnpm test:e2e:chromium
